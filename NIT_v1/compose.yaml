services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started

  backend:
    image: nit-v1-backend:local
    build:
      context: .
    environment:
      DATABASE_URL: &database_url "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      RUST_LOG: "nit_v1=trace"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./frontend
        - action: rebuild
          path: ./migrations
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock
        - action: rebuild
          path: ./Dockerfile

  migrate:
    image: nit-v1-backend:local
    pull_policy: never
    command: ["sqlx", "migrate", "run"]
    environment:
      DATABASE_URL: *database_url
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in NIT_v1/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in NIT_v1/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in NIT_v1/.env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
