services:
  backend:
    build:
      context: .
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      RUST_LOG: "nit_v1=trace"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in NIT_v1/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in NIT_v1/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in NIT_v1/.env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
