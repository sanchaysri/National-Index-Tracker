[package]

name = "nit_v1"
version = "0.1.0"
edition = "2024"

[dependencies]

argon2 = "0.5.3"
axum = "0.8.9"
dotenvy = "0.15.7"
email_address = { version = "0.2.9", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "1.54.1", features = ["full"] }
